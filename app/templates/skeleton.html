<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='brand-mark.png') }}">
    <title>{% block title %}ChatAI{% endblock %} · Bit &amp; Bytes</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bnb-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', path='js/tailwind.js') }}"></script>
    <script src="{{ url_for('static', path='js/tailwind_config.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/brand.css') }}?v=20261022s">
    {% block extrastyle %}{% endblock %}
</head>
<body class="bnb-body {% block body_class %}{% endblock %}">
<div class="bnb-shell">
    {% block shell_nav %}
    {% include "navbar.html" %}
    {% endblock %}
    <main id="main-content" class="bnb-main">
        {% block content %}{% endblock %}
    </main>
    {% block footer %}
    {% include "footer.html" %}
    {% endblock %}
</div>
<script src="{{ url_for('static', path='js/theme.js') }}?v=20261022f"></script>
<script src="{{ url_for('static', path='js/password_toggle.js') }}?v=20261022c"></script>
{% block extrajs %}{% endblock %}
</body>
</html>
