{% extends "skeleton.html" %}
{% block title %}Create account{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<section class="bnb-auth">
  <div class="bnb-auth__card">
    <img src="{{ url_for('static', path='brand-mark.png') }}" alt="" width="44" height="44">
    <h1>Create account</h1>
    <p>Set up a workspace for your business assistants and documents.</p>
    <form id="signupForm">
      <div class="bnb-field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" autocomplete="name" placeholder="Ana Costa">
      </div>
      <div class="bnb-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@company.com">
      </div>
      <div class="bnb-field">
        <label for="password">Password</label>
        <div class="bnb-password">
          <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="Min. 8 chars, mixed case, number, symbol">
          <button type="button" class="bnb-password__toggle" aria-label="Show password"></button>
        </div>
      </div>
      <button type="submit" class="bnb-btn bnb-btn--primary bnb-btn--block">Create account</button>
    </form>
    <div class="bnb-auth__meta">
      Already have an account? <a href="/login">Sign in</a>
    </div>
    <div id="error" class="bnb-alert" hidden></div>
  </div>
</section>
{% endblock %}
{% block extrajs %}
<script>
document.getElementById('signupForm').onsubmit = async function (e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const full_name = document.getElementById('full_name').value;
  const err = document.getElementById('error');
  err.hidden = true;
  const res = await fetch('/api/v1/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, full_name })
  });
  if (res.ok) {
    await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    window.location.href = '/dashboard';
  } else {
    let errorMsg = 'Registration failed.';
    try {
      const data = await res.json();
      if (data && data.detail) errorMsg = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
    } catch (ex) {}
    err.textContent = errorMsg;
    err.hidden = false;
  }
};
</script>
{% endblock %}
