{% extends "skeleton.html" %}
{% block title %}Forgot password{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<section class="bnb-auth">
  <div class="bnb-auth__card">
    <img src="{{ url_for('static', path='brand-mark.png') }}" alt="" width="44" height="44">
    <h1>Reset password</h1>
    <p>Enter the email on your account. We’ll send a reset link if it exists.</p>
    <form id="forgotForm">
      <div class="bnb-field">
        <label for="forgot_email">Email</label>
        <input type="email" id="forgot_email" required placeholder="you@company.com">
      </div>
      <button type="submit" class="bnb-btn bnb-btn--primary bnb-btn--block">Send reset link</button>
    </form>
    <div class="bnb-auth__meta">
      <a href="/login">Back to sign in</a>
    </div>
    <div id="forgotMsg" class="bnb-alert" hidden style="background:rgba(61,207,154,.12);border-color:rgba(61,207,154,.35);color:#9aecc8"></div>
    <div id="forgotError" class="bnb-alert" hidden></div>
  </div>
</section>
{% endblock %}
{% block extrajs %}
<script>
document.getElementById('forgotForm').onsubmit = async function (e) {
  e.preventDefault();
  document.getElementById('forgotMsg').textContent = 'If this email exists, a reset link has been sent.';
  document.getElementById('forgotMsg').hidden = false;
  document.getElementById('forgotError').hidden = true;
};
</script>
{% endblock %}
